<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Jailbreak - Ghost Edition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .main-container {
            margin-top: 40px;
        }
        .ghost-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #ff003c;
            box-shadow: 0 0 20px #ff003c;
            object-fit: cover;
        }
        h1 {
            margin-top: 15px;
            color: #ff003c;
            font-size: 24px;
        }
        .btn {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: #ff003c;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 15px;
            box-shadow: 0 0 12px #ff003c;
            transition: 0.3s;
        }
        .btn:hover {
            background: #d90032;
        }
        .btn-support {
            background: #00f2fe;
            color: #000;
            box-shadow: 0 0 12px #00f2fe;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            width: 70px;
            height: 70px;
            border: 8px solid #222;
            border-top: 8px solid #ff003c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #progress-text {
            font-size: 28px;
            margin-top: 20px;
            color: #ff003c;
            font-weight: bold;
        }
        #status-msg {
            font-size: 20px;
            margin-top: 10px;
            color: #25efd5;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loading">
        <div class="spinner" id="loading-spinner"></div>
        <div id="progress-text">0%</div>
        <div id="status-msg">جاري تهيئة النظام...</div>
    </div>

    <div class="main-container">
        <!-- صورة غوست -->
        <img src="631fd36783d79e1e2ea3ea7338b0b8b0.jpg" alt="Ghost" class="ghost-img">
        <h1>منصة التهكير - Ghost Edition</h1>
        
        <div>
            <button onclick="startJailbreak()" class="btn">تفعيل GoldHen</button>
        </div>
        <div>
            <a href="https://www.tiktok.com/" target="_blank" class="btn btn-support">رابط دعم التيك توك</a>
        </div>
    </div>

    <script>
        function startJailbreak() {
            let loadingScreen = document.getElementById('loading');
            let progressText = document.getElementById('progress-text');
            let statusMsg = document.getElementById('status-msg');
            let spinner = document.getElementById('loading-spinner');
            
            loadingScreen.style.display = 'flex';
            let percent = 0;
            
            let stages = [
                { at: 20, msg: "جاري فحص الثغرة..." },
                { at: 50, msg: "جاري تحميل ملفات الـ Jb والذاكرة..." },
                { at: 80, msg: "جاري حقن GoldHen.bin..." },
                { at: 100, msg: "Ghost Done!" }
            ];

            let interval = setInterval(function() {
                percent += 1;
                progressText.innerText = percent + "%";
                
                let currentStage = stages.find(s => s.at === percent);
                if (currentStage) {
                    statusMsg.innerText = currentStage.msg;
                }

                if (percent >= 100) {
                    clearInterval(interval);
                    // إيقاف الدوران وإخفاء الـ Spinner، وإبقاء رسالة النجاح بوضوح
                    spinner.style.display = 'none';
                    progressText.style.color = '#25efd5';
                    progressText.innerText = "Ghost Done!";
                    statusMsg.innerText = "تم تفعيل GoldHen بنجاح!";
                    
                    // إخفاء شاشة التحميل بعد ثانيتين تلقائياً لتعود للصفحة الرئيسية
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        // إعادة تعيين الشاشة تحسباً لإعادة المحاولة لاحقاً
                        spinner.style.display = 'block';
                        progressText.style.color = '#ff003c';
                    }, 2500);
                }
            }, 30); 
        }
    </script>
</body>
</html>
