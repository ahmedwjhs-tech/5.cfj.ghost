<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة التهكير الخاصة بك</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #0070d1;
        }
        .btn {
            background-color: #0070d1;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #005bb5;
        }
        .support-link {
            margin-top: 25px;
            display: block;
            color: #0070d1;
            text-decoration: none;
            font-size: 18px;
        }
        .support-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <img src="ghost.jpg" alt="Ghost" style="width: 180px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    <h1>مرحباً بك في منصة التهكير الخاصة بك</h1>
    <p>اضغط على الزر أدناه لتفعيل GoldHEN:</p>
    
    <button id="jailbreakBtn" class="btn" onclick="startJailbreak()">تفعيل التهكير</button>

    <br>
    <a href="https://vm.tiktok.com/ZS9U7uhBD8SE4-ap3Mk/" target="_blank" class="support-link">Ghost</a>

    <script>
        function startJailbreak() {
            const btn = document.getElementById('jailbreakBtn');
            btn.innerText = 'جاري التحميل... (Loading)';
            btn.disabled = true;
            
            // الانتظار لمدة ثانيتين ثم التحويل لرابط التهكير الأصلي
            setTimeout(() => {
                window.location.href = 'https://gamerhack.github.io/g2all/';
            }, 2000);
        }
    </script>
</body>
</html>
